name: main

on:
  - push
  - pull_request

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
        # Порог покрытия задан переменной COVERAGE_MIN в Makefile, поэтому шаг
        # падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run tests
        run: make test-coverage

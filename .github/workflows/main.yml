name: main

on:
  - push
  - pull_request

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Lint
        run: make lint
        # Порог покрытия задан переменной COVERAGE_MIN в Makefile, поэтому шаг
        # падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run tests
        run: make test-coverage

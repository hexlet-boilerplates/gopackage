name: main

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Lint
        run: mise exec -- hk check --all
        # Порог покрытия задан переменной COVERAGE_MIN в Makefile, поэтому шаг
        # падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run tests
        run: make test-coverage
